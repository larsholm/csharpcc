name: .NET

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/CSharpCC.sln
      - run: dotnet build src/CSharpCC.sln --configuration ${{ matrix.configuration }} --no-restore
      - run: dotnet test src/CSharpCC.sln --configuration ${{ matrix.configuration }} --no-build
